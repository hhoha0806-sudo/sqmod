<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị - SQ MOD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            padding: 30px 20px;
            min-height: 100vh;
        }
        
        /* Login Box */
        #login-box {
            max-width: 380px; margin: 100px auto; 
            background: #161b22; padding: 35px 25px; 
            border-radius: 8px; border: 1px solid #30363d;
        }
        #login-box h2 { margin-bottom: 20px; color: #f0f6fc; font-size: 20px; font-weight: 600; text-align: center;}
        #login-box input { 
            width: 100%; padding: 10px 12px; margin-bottom: 15px; 
            background: #0d1117; border: 1px solid #30363d; 
            color: #c9d1d9; border-radius: 6px; outline: none;
        }
        #login-box input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,0.3); }
        #login-box button { 
            width: 100%; padding: 10px; background: #238636; 
            color: #fff; border: 1px solid rgba(240,246,252,0.1); border-radius: 6px; 
            font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s;
        }
        #login-box button:hover { background: #2ea043; }

        /* Giao diện Admin */
        #admin-panel { display: none; max-width: 1100px; margin: 0 auto; }
        
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #30363d;
        }
        .header h1 { font-size: 20px; font-weight: 600; color: #f0f6fc; }
        .header h1 i { color: #8b949e; margin-right: 8px; }
        
        .btn-logout { 
            padding: 6px 15px; background: transparent; 
            border: 1px solid #30363d; color: #c9d1d9; 
            border-radius: 6px; font-weight: 500; cursor: pointer; transition: 0.2s; font-size: 13px;
        }
        .btn-logout:hover { background: #30363d; }

        /* Thống kê (3 ô) */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { 
            background: #161b22; border: 1px solid #30363d; 
            padding: 20px; border-radius: 6px; 
        }
        .stat-card p { color: #8b949e; font-size: 13px; margin-bottom: 8px; font-weight: 500;}
        .stat-card h3 { font-size: 24px; font-weight: 600; color: #f0f6fc;}
        
        .stat-card.active h3 { color: #3fb950; }

        /* Thanh công cụ */
        .actions { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 15px; flex-wrap: wrap; }
        .actions input { 
            padding: 8px 12px; background: #0d1117; 
            border: 1px solid #30363d; color: #c9d1d9; 
            border-radius: 6px; flex: 1; min-width: 250px; outline: none; font-size: 14px;
        }
        .actions input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,0.3); }
        .btn-add { 
            padding: 8px 16px; background: #1f6feb; color: #fff; 
            border: 1px solid rgba(240,246,252,0.1); border-radius: 6px; font-weight: 600; 
            cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-add:hover { background: #388bfd; }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 1px solid #30363d; padding-bottom: 10px;}
        .tab { 
            padding: 6px 12px; background: transparent; border: none;
            border-radius: 6px; cursor: pointer; font-size: 14px; color: #8b949e;
            font-weight: 500; transition: 0.2s;
        }
        .tab:hover { background: #30363d; color: #c9d1d9;}
        .tab.active { background: #30363d; color: #f0f6fc; }

        /* Bảng danh sách */
        .table-responsive { 
            border: 1px solid #30363d; border-radius: 6px; 
            overflow-x: auto; background: #161b22;
        }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #30363d; font-size: 14px; }
        th { color: #8b949e; font-weight: 600; font-size: 13px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #21262d; }
        
        .status-green { color: #3fb950; font-size: 13px; font-weight: 500;}
        
        .btn-action { 
            padding: 5px 10px; border: 1px solid #30363d; border-radius: 6px; 
            cursor: pointer; font-weight: 500; font-size: 12px; background: transparent; color: #c9d1d9;
            transition: 0.2s;
        }
        .btn-edit:hover { border-color: #8b949e; }
        .btn-delete { color: #f85149; border-color: rgba(248,81,73,0.4); }
        .btn-delete:hover { background: #da3633; color: #fff; border-color: #da3633;}

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(1,4,9,0.8); justify-content: center; align-items: center; z-index: 999;}
        .modal-overlay.active { display: flex; }
        .modal-content { 
            background: #161b22; padding: 24px; border-radius: 6px; 
            width: 90%; max-width: 450px; border: 1px solid #30363d;
        }
        .modal-content h3 { margin-bottom: 20px; color: #f0f6fc; font-size: 18px; }
        .modal-content label { font-size: 13px; color: #c9d1d9; margin-bottom: 6px; display: block; font-weight: 500;}
        .modal-content input, .modal-content select { 
            width: 100%; padding: 8px 12px; margin-bottom: 15px; 
            background: #0d1117; border: 1px solid #30363d; 
            color: #c9d1d9; border-radius: 6px; outline: none; font-size: 14px;
        }
        .modal-content input:focus, .modal-content select:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,0.3); }
        
        .modal-btns { display: flex; gap: 12px; margin-top: 10px; justify-content: flex-end;}
        .modal-btns button { padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px;}
        .btn-save { background: #238636; color: #fff; border: 1px solid rgba(240,246,252,0.1); }
        .btn-save:hover { background: #2ea043; }
        .btn-cancel { background: transparent; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-cancel:hover { background: #30363d; }
    </style>
</head>
<body>

    <!-- Form Đăng Nhập -->
    <div id="login-box">
        <h2><i class="fa-solid fa-lock"></i> Đăng nhập Admin</h2>
        <input type="password" id="admin-pass" placeholder="Nhập mật khẩu...">
        <button onclick="login()">Đăng nhập</button>
    </div>

    <!-- Giao diện Admin -->
    <div id="admin-panel">
        <div class="header">
            <h1><i class="fa-solid fa-gear"></i> Hệ Thống Quản Trị</h1>
            <button class="btn-logout" onclick="logout()">Đăng xuất</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <p>Tổng số bản Mod</p>
                <h3 id="stat-total">0</h3>
            </div>
            <div class="stat-card active">
                <p>Đang hoạt động</p>
                <h3 id="stat-active">0</h3>
            </div>
            <div class="stat-card">
                <p>Người online</p>
                <!-- Mã đếm người online thật của Kovak -->
                <div style="margin-top: 5px; height: 25px; display: flex; align-items: center;">
                    <script id="_wau5uu">var _wau = _wau || []; _wau.push(["dynamic", "iyr9s4stmh", "5uu", "c4302bffffff", "small"]);</script><script async src="//waust.at/d.js"></script>
                </div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="filterTable('all', this)">Tất cả</div>
            <div class="tab" onclick="filterTable('page-proxy', this)">Menu</div>
            <div class="tab" onclick="filterTable('page-dinhvi', this)">Định Vị</div>
            <div class="tab" onclick="filterTable('page-skin', this)">Mod Skin</div>
        </div>

        <div class="actions">
            <input type="text" id="search-input" placeholder="Tìm kiếm bản mod..." onkeyup="searchTable()">
            <button class="btn-add" onclick="openModal('add')"><i class="fa-solid fa-plus"></i> Thêm Mod Mới</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ẢNH</th>
                        <th>TÊN BẢN MOD</th>
                        <th>DANH MỤC</th>
                        <th>LINK TẢI</th>
                        <th>TRẠNG THÁI</th>
                        <th>THAO TÁC</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dữ liệu sẽ được tự động tải từ Firebase vào đây -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Thêm/Sửa -->
    <div class="modal-overlay" id="modal-form">
        <div class="modal-content">
            <h3 id="modal-title">Thêm Mod Mới</h3>
            <input type="hidden" id="mod-id">
            
            <label>Tên Mod</label>
            <input type="text" id="mod-name" placeholder="VD: BÁO HỒNG">
            
            <label>Danh mục</label>
            <select id="mod-category">
                <option value="page-proxy">MENU</option>
                <option value="page-dinhvi">ĐỊNH VỊ</option>
                <option value="page-skin">MOD SKIN</option>
            </select>

            <label>Link Ảnh</label>
            <input type="text" id="mod-img" placeholder="https://...">
            
            <label>Link Tải</label>
            <input type="text" id="mod-link" placeholder="https://...">
            
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">Hủy</button>
                <button class="btn-save" onclick="saveMod()">Lưu Dữ Liệu</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBA6LXphLTRJw-cKECEPNAzODAkHB3oKHI",
            authDomain: "sq-mod-key.firebaseapp.com",
            projectId: "sq-mod-key",
            storageBucket: "sq-mod-key.firebasestorage.app",
            messagingSenderId: "1027007715479",
            appId: "1:1027007715479:web:e341f8f70978f2058e71d2",
            measurementId: "G-2J4WVTPM8C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.db = db;
        window.fbTools = { collection, addDoc, getDocs, deleteDoc, doc, updateDoc };

        // MẬT KHẨU MỚI
        const ADMIN_PASS = "SỸ QUYỀN K11"; 
        let allMods = [];

        window.login = function() {
            let pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadData();
            } else {
                alert("Sai mật khẩu!");
            }
        }

        window.logout = function() {
            location.reload();
        }

        async function loadData() {
            const { collection, getDocs } = window.fbTools;
            try {
                const querySnapshot = await getDocs(collection(window.db, "mods"));
                allMods = [];
                querySnapshot.forEach((doc) => {
                    allMods.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
                document.getElementById('stat-total').innerText = allMods.length;
                document.getElementById('stat-active').innerText = allMods.length;
            } catch (e) {
                console.error("Lỗi tải dữ liệu: ", e);
            }
        }

        window.filterTable = function(category, tabElement) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(tabElement) tabElement.classList.add('active');
            
            if(category === 'all') {
                renderTable(allMods);
            } else {
                const filtered = allMods.filter(m => m.category === category);
                renderTable(filtered);
            }
        }

        window.searchTable = function() {
            const text = document.getElementById('search-input').value.toLowerCase();
            const filtered = allMods.filter(m => m.name.toLowerCase().includes(text));
            renderTable(filtered);
        }

        function renderTable(dataToRender = allMods) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            dataToRender.forEach(mod => {
                let catName = mod.category === 'page-proxy' ? 'MENU' : (mod.category === 'page-dinhvi' ? 'ĐỊNH VỊ' : 'MOD SKIN');
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${mod.img}" width="40" height="40" style="border-radius: 6px; object-fit: cover; border: 1px solid #30363d;" onerror="this.src='https://i.ibb.co/0VKpd4C4/file-00000000031081fab71b349b2f53c583.png'"></td>
                    <td><b style="color:#f0f6fc;">${mod.name}</b></td>
                    <td><span style="color:#8b949e;">${catName}</span></td>
                    <td><a href="${mod.link}" target="_blank" style="color:#58a6ff; text-decoration:none;">Tải xuống</a></td>
                    <td><span class="status-green">Hoạt động</span></td>
                    <td>
                        <button class="btn-action btn-edit" onclick="editMod('${mod.id}')">Sửa</button>
                        <button class="btn-action btn-delete" onclick="deleteMod('${mod.id}')">Xóa</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.openModal = function(type) {
            document.getElementById('modal-form').classList.add('active');
            if(type === 'add') {
                document.getElementById('modal-title').innerText = "Thêm Mod Mới";
                document.getElementById('mod-id').value = "";
                document.getElementById('mod-name').value = "";
                document.getElementById('mod-img').value = "";
                document.getElementById('mod-link').value = "";
            }
        }

        window.closeModal = function() {
            document.getElementById('modal-form').classList.remove('active');
        }

        window.editMod = function(id) {
            const mod = allMods.find(m => m.id === id);
            if(!mod) return;
            
            document.getElementById('modal-form').classList.add('active');
            document.getElementById('modal-title').innerText = "Sửa Mod";
            document.getElementById('mod-id').value = mod.id;
            document.getElementById('mod-name').value = mod.name;
            document.getElementById('mod-category').value = mod.category;
            document.getElementById('mod-img').value = mod.img;
            document.getElementById('mod-link').value = mod.link;
        }

        window.saveMod = async function() {
            const { collection, addDoc, doc, updateDoc } = window.fbTools;
            const id = document.getElementById('mod-id').value;
            const name = document.getElementById('mod-name').value;
            const category = document.getElementById('mod-category').value;
            const img = document.getElementById('mod-img').value;
            const link = document.getElementById('mod-link').value;

            if(!name || !img || !link) { alert("Vui lòng nhập đủ thông tin!"); return; }

            try {
                if(id) {
                    const docRef = doc(window.db, "mods", id);
                    await updateDoc(docRef, { name, category, img, link });
                    alert("Đã cập nhật!");
                } else {
                    await addDoc(collection(window.db, "mods"), { name, category, img, link });
                    alert("Đã thêm mới!");
                }
                closeModal();
                loadData();
            } catch (e) {
                alert("Lỗi: " + e.message);
            }
        }

        window.deleteMod = async function(id) {
            if(confirm("Bạn có chắc chắn muốn xóa Mod này không?")) {
                const { doc, deleteDoc } = window.fbTools;
                try {
                    await deleteDoc(doc(window.db, "mods", id));
                    loadData();
                } catch (e) {
                    alert("Lỗi xóa: " + e.message);
                }
            }
        }
    </script>
</body>
</html>
