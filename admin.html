<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SQ MOD</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #0b0f19; color: #fff; padding: 20px; }
        
        /* Login Box */
        #login-box {
            max-width: 400px; margin: 100px auto; background: #151b2b; padding: 30px; border-radius: 15px; text-align: center;
            border: 1px solid #232d42;
        }
        #login-box h2 { margin-bottom: 20px; color: #00e5ff; }
        #login-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0f19; border: 1px solid #232d42; color: #fff; border-radius: 8px; }
        #login-box button { width: 100%; padding: 12px; background: #00e5ff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Giao diện Admin */
        #admin-panel { display: none; max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: #151b2b; border: 1px solid #232d42; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .tab.active { background: #1c2638; color: #00e5ff; border-color: #00e5ff; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #151b2b; padding: 20px; border-radius: 10px; border: 1px solid #232d42; }
        .stat-card p { color: #888; font-size: 13px; margin-bottom: 5px; }
        .stat-card h3 { font-size: 24px; }

        .actions { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        .actions input, .actions select { padding: 10px; background: #151b2b; border: 1px solid #232d42; color: #fff; border-radius: 8px; flex: 1; min-width: 200px; }
        .btn-add { padding: 10px 20px; background: #4b32e3; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Bảng danh sách */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: #151b2b; border-radius: 10px; overflow: hidden; min-width: 800px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #232d42; font-size: 14px; }
        th { color: #888; font-weight: 600; }
        .status-green { background: rgba(0, 255, 136, 0.1); color: #00ff88; padding: 4px 8px; border-radius: 5px; font-size: 12px; }
        .btn-action { padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px; font-weight: bold; }
        .btn-edit { background: #333; color: #fff; }
        .btn-delete { background: #ff0033; color: #fff; }

        /* Modal Thêm/Sửa */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 999;}
        .modal-overlay.active { display: flex; }
        .modal-content { background: #151b2b; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; border: 1px solid #232d42;}
        .modal-content h3 { margin-bottom: 15px; color: #00e5ff; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 10px; background: #0b0f19; border: 1px solid #232d42; color: #fff; border-radius: 5px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;}
        .btn-save { background: #00e5ff; color: #000; }
        .btn-cancel { background: #333; color: #fff; }
    </style>
</head>
<body>

    <!-- Form Đăng Nhập -->
    <div id="login-box">
        <h2><i class="fa-solid fa-lock"></i> ADMIN LOGIN</h2>
        <input type="password" id="admin-pass" placeholder="Nhập mật khẩu Admin...">
        <button onclick="login()">ĐĂNG NHẬP</button>
    </div>

    <!-- Giao diện Admin -->
    <div id="admin-panel">
        <div class="header">
            <h1 style="color: #00e5ff;">Quản Lý Web SQ MOD</h1>
            <button onclick="logout()" style="padding: 10px; background: #ff0033; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight:bold;">Đăng xuất</button>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="filterTable('all')">Tất cả Bản Mod</div>
            <div class="tab" onclick="filterTable('page-proxy')">Menu</div>
            <div class="tab" onclick="filterTable('page-dinhvi')">Định Vị</div>
            <div class="tab" onclick="filterTable('page-skin')">Mod Skin</div>
        </div>

        <div class="stats">
            <div class="stat-card"><p>Tổng Số Bản Mod</p><h3 id="stat-total">0</h3></div>
            <div class="stat-card"><p>Đang Hoạt Động</p><h3 style="color: #00ff88;" id="stat-active">0</h3></div>
            <div class="stat-card"><p>Tổng Lượt Tải (Demo)</p><h3 style="color: #ffd700;">999+</h3></div>
            <div class="stat-card"><p>Người Online (Demo)</p><h3 style="color: #00e5ff;">12</h3></div>
        </div>

        <div class="actions">
            <input type="text" id="search-input" placeholder="Tìm theo tên bản mod..." onkeyup="searchTable()">
            <button class="btn-add" onclick="openModal('add')">+ Thêm Bản Mod Mới</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ẢNH</th>
                        <th>TÊN BẢN MOD</th>
                        <th>DANH MỤC</th>
                        <th>LINK TẢI</th>
                        <th>TRẠNG THÁI</th>
                        <th>THAO TÁC</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dữ liệu sẽ được tự động tải từ Firebase vào đây -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Thêm/Sửa -->
    <div class="modal-overlay" id="modal-form">
        <div class="modal-content">
            <h3 id="modal-title">Thêm Mod Mới</h3>
            <input type="hidden" id="mod-id">
            <input type="text" id="mod-name" placeholder="Tên Mod (VD: BÁO HỒNG)">
            
            <select id="mod-category">
                <option value="page-proxy">MENU</option>
                <option value="page-dinhvi">ĐỊNH VỊ</option>
                <option value="page-skin">MOD SKIN</option>
            </select>

            <input type="text" id="mod-img" placeholder="Link Ảnh (https://...)">
            <input type="text" id="mod-link" placeholder="Link Tải (https://...)">
            
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">Hủy</button>
                <button class="btn-save" onclick="saveMod()">Lưu Dữ Liệu</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình Firebase của Kovak
        const firebaseConfig = {
            apiKey: "AIzaSyBA6LXphLTRJw-cKECEPNAzODAkHB3oKHI",
            authDomain: "sq-mod-key.firebaseapp.com",
            projectId: "sq-mod-key",
            storageBucket: "sq-mod-key.firebasestorage.app",
            messagingSenderId: "1027007715479",
            appId: "1:1027007715479:web:e341f8f70978f2058e71d2",
            measurementId: "G-2J4WVTPM8C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.db = db;
        window.fbTools = { collection, addDoc, getDocs, deleteDoc, doc, updateDoc };

        const ADMIN_PASS = "sqmod123"; 
        let allMods = [];

        window.login = function() {
            let pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadData();
            } else {
                alert("Sai mật khẩu!");
            }
        }

        window.logout = function() {
            location.reload();
        }

        // Hàm tải dữ liệu
        async function loadData() {
            const { collection, getDocs } = window.fbTools;
            try {
                const querySnapshot = await getDocs(collection(window.db, "mods"));
                allMods = [];
                querySnapshot.forEach((doc) => {
                    allMods.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
                document.getElementById('stat-total').innerText = allMods.length;
                document.getElementById('stat-active').innerText = allMods.length;
            } catch (e) {
                console.error("Lỗi tải dữ liệu: ", e);
            }
        }

        // Hiển thị bảng
        window.filterTable = function(category) {
            if(category === 'all') {
                renderTable(allMods);
            } else {
                const filtered = allMods.filter(m => m.category === category);
                renderTable(filtered);
            }
        }

        window.searchTable = function() {
            const text = document.getElementById('search-input').value.toLowerCase();
            const filtered = allMods.filter(m => m.name.toLowerCase().includes(text));
            renderTable(filtered);
        }

        function renderTable(dataToRender = allMods) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            dataToRender.forEach(mod => {
                let catName = mod.category === 'page-proxy' ? 'MENU' : (mod.category === 'page-dinhvi' ? 'ĐỊNH VỊ' : 'MOD SKIN');
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${mod.img}" width="50" style="border-radius: 5px;" onerror="this.src='https://i.ibb.co/0VKpd4C4/file-00000000031081fab71b349b2f53c583.png'"></td>
                    <td><b>${mod.name}</b></td>
                    <td>${catName}</td>
                    <td>Mediafire</td>
                    <td><span class="status-green">Hoạt động</span></td>
                    <td>
                        <button class="btn-action btn-edit" onclick="editMod('${mod.id}')">Sửa</button>
                        <button class="btn-action btn-delete" onclick="deleteMod('${mod.id}')">Xóa</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Mở/Đóng Modal
        window.openModal = function(type) {
            document.getElementById('modal-form').classList.add('active');
            if(type === 'add') {
                document.getElementById('modal-title').innerText = "Thêm Mod Mới";
                document.getElementById('mod-id').value = "";
                document.getElementById('mod-name').value = "";
                document.getElementById('mod-img').value = "";
                document.getElementById('mod-link').value = "";
            }
        }

        window.closeModal = function() {
            document.getElementById('modal-form').classList.remove('active');
        }

        // Sửa Mod
        window.editMod = function(id) {
            const mod = allMods.find(m => m.id === id);
            if(!mod) return;
            
            document.getElementById('modal-form').classList.add('active');
            document.getElementById('modal-title').innerText = "Sửa Mod";
            document.getElementById('mod-id').value = mod.id;
            document.getElementById('mod-name').value = mod.name;
            document.getElementById('mod-category').value = mod.category;
            document.getElementById('mod-img').value = mod.img;
            document.getElementById('mod-link').value = mod.link;
        }

        // Lưu Mod (Thêm hoặc Cập nhật)
        window.saveMod = async function() {
            const { collection, addDoc, doc, updateDoc } = window.fbTools;
            const id = document.getElementById('mod-id').value;
            const name = document.getElementById('mod-name').value;
            const category = document.getElementById('mod-category').value;
            const img = document.getElementById('mod-img').value;
            const link = document.getElementById('mod-link').value;

            if(!name || !img || !link) { alert("Nhập đủ thông tin!"); return; }

            try {
                if(id) {
                    // Cập nhật
                    const docRef = doc(window.db, "mods", id);
                    await updateDoc(docRef, { name, category, img, link });
                    alert("Đã cập nhật!");
                } else {
                    // Thêm mới
                    await addDoc(collection(window.db, "mods"), { name, category, img, link });
                    alert("Đã thêm mới!");
                }
                closeModal();
                loadData();
            } catch (e) {
                alert("Lỗi: " + e.message);
            }
        }

        // Xóa Mod
        window.deleteMod = async function(id) {
            if(confirm("Bạn có chắc chắn muốn xóa Mod này không?")) {
                const { doc, deleteDoc } = window.fbTools;
                try {
                    await deleteDoc(doc(window.db, "mods", id));
                    loadData();
                } catch (e) {
                    alert("Lỗi xóa: " + e.message);
                }
            }
        }
    </script>
</body>
    </html>
